name: Native Windows regression

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run all native Windows deterministic fixtures
        shell: pwsh
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PWSH = (Get-Command pwsh).Source
          python -m scripts.windows_ci --output "$env:RUNNER_TEMP/windows-regression"
          exit $LASTEXITCODE
      - name: Summarize native Windows evidence
        if: always()
        shell: pwsh
        run: |
          $summary = Join-Path $env:RUNNER_TEMP 'windows-regression/summary.md'
          if (Test-Path -LiteralPath $summary) {
            Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            'Native Windows regression did not produce a report; validation is not verified.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-regression-evidence
          path: ${{ runner.temp }}/windows-regression
          if-no-files-found: error
