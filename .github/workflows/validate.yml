name: Layer 1 - Required deterministic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run all deterministic checks in Docker
        run: python scripts/run_validation.py --layer pr --output "$RUNNER_TEMP/validation-pr"
      - name: Summarize executed checks and platform exclusions
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/validation-pr/summary.md" ]; then
            cat "$RUNNER_TEMP/validation-pr/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Layer 1 did not produce a report; validation is not verified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-pr
          path: ${{ runner.temp }}/validation-pr
          if-no-files-found: error
