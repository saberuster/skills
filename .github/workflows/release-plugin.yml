name: Prepare plugin release draft

on:
  push:
    tags:
      - '*/v*'

concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build artifacts from the event commit
        run: python scripts/release_plugin.py prepare --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --output-dir dist
      - name: Create or resume the draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_plugin.py draft --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --repo "$RELEASE_REPOSITORY" --output-dir dist
      - name: Retain release build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14
